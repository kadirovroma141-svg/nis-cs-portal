<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, sans-serif">
  <rect width="800" height="520" fill="#f3f5f8"/>
  <!-- плата -->
  <rect x="60" y="20" width="680" height="480" rx="10" fill="#1f6e4a" stroke="#134a31" stroke-width="4"/>
  <!-- дорожки (шины) -->
  <g stroke="#7bc59d" stroke-width="3" fill="none" opacity="0.8">
    <path d="M310 180 V225"/><path d="M370 120 H420"/>
    <path d="M350 255 H400 V330 H430"/><path d="M270 255 H200 V340"/>
    <path d="M510 365 H560 V390"/><path d="M510 380 H640"/>
    <path d="M120 150 H250"/><path d="M430 360 H400 V420"/>
  </g>

  <!-- задняя панель с портами -->
  <rect x="64" y="40" width="60" height="230" rx="4" fill="#9aa5b1" stroke="#5d6772" stroke-width="2"/>
  <g fill="#2b2f36">
    <rect x="76" y="56" width="36" height="14" rx="2"/><rect x="76" y="78" width="36" height="14" rx="2"/>
    <rect x="76" y="108" width="36" height="22" rx="3"/>
    <rect x="76" y="142" width="36" height="26" rx="3"/>
    <rect x="76" y="182" width="36" height="14" rx="2"/><rect x="76" y="204" width="36" height="14" rx="2"/>
    <circle cx="86" cy="242" r="7"/><circle cx="104" cy="242" r="7"/>
  </g>

  <!-- сокет процессора -->
  <rect x="250" y="60" width="120" height="120" rx="6" fill="#cfd6de" stroke="#7a8794" stroke-width="3"/>
  <rect x="268" y="78" width="84" height="84" fill="#e8ecf0" stroke="#9aa5b1"/>
  <g fill="#b0bac4">
    <circle cx="282" cy="92" r="2"/><circle cx="296" cy="92" r="2"/><circle cx="310" cy="92" r="2"/><circle cx="324" cy="92" r="2"/><circle cx="338" cy="92" r="2"/>
    <circle cx="282" cy="106" r="2"/><circle cx="296" cy="106" r="2"/><circle cx="310" cy="106" r="2"/><circle cx="324" cy="106" r="2"/><circle cx="338" cy="106" r="2"/>
    <circle cx="282" cy="120" r="2"/><circle cx="296" cy="120" r="2"/><circle cx="310" cy="120" r="2"/><circle cx="324" cy="120" r="2"/><circle cx="338" cy="120" r="2"/>
    <circle cx="282" cy="134" r="2"/><circle cx="296" cy="134" r="2"/><circle cx="310" cy="134" r="2"/><circle cx="324" cy="134" r="2"/><circle cx="338" cy="134" r="2"/>
    <circle cx="282" cy="148" r="2"/><circle cx="296" cy="148" r="2"/><circle cx="310" cy="148" r="2"/><circle cx="324" cy="148" r="2"/><circle cx="338" cy="148" r="2"/>
  </g>

  <!-- слоты ОЗУ (вертикально справа от процессора) -->
  <g fill="#2b2f36" stroke="#111" stroke-width="1">
    <rect x="425" y="40" width="12" height="220" rx="2"/><rect x="447" y="40" width="12" height="220" rx="2"/>
    <rect x="469" y="40" width="12" height="220" rx="2"/><rect x="491" y="40" width="12" height="220" rx="2"/>
  </g>
  <g fill="#e6e6e6"><rect x="425" y="46" width="12" height="6"/><rect x="447" y="46" width="12" height="6"/><rect x="469" y="46" width="12" height="6"/><rect x="491" y="46" width="12" height="6"/>
    <rect x="425" y="248" width="12" height="6"/><rect x="447" y="248" width="12" height="6"/><rect x="469" y="248" width="12" height="6"/><rect x="491" y="248" width="12" height="6"/></g>

  <!-- разъём питания платы (24 контакта) -->
  <rect x="580" y="60" width="44" height="190" rx="4" fill="#f2f2f2" stroke="#7a8794" stroke-width="2"/>
  <g fill="#c9ced4">
    <rect x="588" y="70" width="10" height="10"/><rect x="606" y="70" width="10" height="10"/><rect x="588" y="86" width="10" height="10"/><rect x="606" y="86" width="10" height="10"/>
    <rect x="588" y="102" width="10" height="10"/><rect x="606" y="102" width="10" height="10"/><rect x="588" y="118" width="10" height="10"/><rect x="606" y="118" width="10" height="10"/>
    <rect x="588" y="134" width="10" height="10"/><rect x="606" y="134" width="10" height="10"/><rect x="588" y="150" width="10" height="10"/><rect x="606" y="150" width="10" height="10"/>
    <rect x="588" y="166" width="10" height="10"/><rect x="606" y="166" width="10" height="10"/><rect x="588" y="182" width="10" height="10"/><rect x="606" y="182" width="10" height="10"/>
    <rect x="588" y="198" width="10" height="10"/><rect x="606" y="198" width="10" height="10"/><rect x="588" y="214" width="10" height="10"/><rect x="606" y="214" width="10" height="10"/>
    <rect x="588" y="230" width="10" height="10"/><rect x="606" y="230" width="10" height="10"/>
  </g>

  <!-- северный мост (с радиатором) -->
  <rect x="270" y="225" width="80" height="60" rx="4" fill="#8c96a1" stroke="#4d5763" stroke-width="2"/>
  <g stroke="#5f6a76" stroke-width="3"><line x1="282" y1="232" x2="282" y2="278"/><line x1="296" y1="232" x2="296" y2="278"/><line x1="310" y1="232" x2="310" y2="278"/><line x1="324" y1="232" x2="324" y2="278"/><line x1="338" y1="232" x2="338" y2="278"/></g>

  <!-- южный мост -->
  <rect x="430" y="330" width="80" height="70" rx="4" fill="#2b2f36" stroke="#111" stroke-width="2"/>
  <rect x="446" y="346" width="48" height="38" fill="#3c434c"/>

  <!-- микросхема BIOS -->
  <rect x="560" y="388" width="44" height="30" rx="3" fill="#2b2f36" stroke="#111"/>
  <g stroke="#c9ced4" stroke-width="2"><line x1="566" y1="418" x2="566" y2="424"/><line x1="576" y1="418" x2="576" y2="424"/><line x1="586" y1="418" x2="586" y2="424"/><line x1="596" y1="418" x2="596" y2="424"/>
    <line x1="566" y1="382" x2="566" y2="388"/><line x1="576" y1="382" x2="576" y2="388"/><line x1="586" y1="382" x2="586" y2="388"/><line x1="596" y1="382" x2="596" y2="388"/></g>

  <!-- слоты расширения (горизонтально внизу) -->
  <g fill="#2b2f36" stroke="#111">
    <rect x="130" y="340" width="260" height="14" rx="2"/>
    <rect x="130" y="390" width="260" height="14" rx="2"/>
    <rect x="130" y="440" width="260" height="14" rx="2"/>
  </g>
  <g fill="#f0c419"><rect x="130" y="340" width="10" height="14"/><rect x="130" y="390" width="10" height="14"/><rect x="130" y="440" width="10" height="14"/></g>

  <!-- разъёмы SATA -->
  <g fill="#e04b4b" stroke="#8a1f1f">
    <rect x="650" y="340" width="40" height="18" rx="2"/><rect x="650" y="370" width="40" height="18" rx="2"/>
    <rect x="650" y="400" width="40" height="18" rx="2"/><rect x="650" y="430" width="40" height="18" rx="2"/>
  </g>
</svg>
