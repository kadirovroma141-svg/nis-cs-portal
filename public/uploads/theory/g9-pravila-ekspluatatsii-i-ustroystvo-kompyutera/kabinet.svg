<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- стена и пол -->
  <rect width="800" height="380" fill="#eef2f7"/>
  <rect y="380" width="800" height="120" fill="#d9c7a7"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#b9a37f" stroke-width="3"/>

  <!-- окно с солнцем -->
  <rect x="40" y="40" width="160" height="170" rx="4" fill="#bfe3ff" stroke="#8a9bb0" stroke-width="6"/>
  <line x1="120" y1="40" x2="120" y2="210" stroke="#8a9bb0" stroke-width="5"/>
  <line x1="40" y1="125" x2="200" y2="125" stroke="#8a9bb0" stroke-width="5"/>
  <circle cx="75" cy="78" r="22" fill="#ffd54a"/>
  <!-- солнечный луч падает на экран -->
  <polygon points="195,70 200,190 385,215 385,125" fill="#fff3b0" opacity="0.55"/>

  <!-- батарея отопления -->
  <g>
    <rect x="50" y="262" width="130" height="80" rx="6" fill="#f4f4f4" stroke="#9aa5b1" stroke-width="2"/>
    <g stroke="#c4ccd4" stroke-width="2">
      <line x1="66" y1="268" x2="66" y2="336"/><line x1="82" y1="268" x2="82" y2="336"/><line x1="98" y1="268" x2="98" y2="336"/>
      <line x1="114" y1="268" x2="114" y2="336"/><line x1="130" y1="268" x2="130" y2="336"/><line x1="146" y1="268" x2="146" y2="336"/><line x1="162" y1="268" x2="162" y2="336"/>
    </g>
    <!-- волны тепла -->
    <g fill="none" stroke="#ff7a59" stroke-width="2.5" stroke-linecap="round">
      <path d="M190 300 q6 -8 0 -16 q-6 -8 0 -16"/>
      <path d="M180 245 q6 -8 0 -16 q-6 -8 0 -16"/>
      <path d="M150 248 q6 -8 0 -16 q-6 -8 0 -16"/>
    </g>
  </g>

  <!-- системный блок вплотную к батарее -->
  <g>
    <rect x="186" y="248" width="66" height="222" rx="5" fill="#3d4652" stroke="#262c33" stroke-width="2"/>
    <rect x="196" y="262" width="46" height="10" rx="2" fill="#5b6672"/>
    <circle cx="219" cy="292" r="6" fill="#7ee08a"/>
    <!-- вентиляционная решётка с пылью -->
    <g stroke="#6c7783" stroke-width="2">
      <line x1="198" y1="380" x2="240" y2="380"/><line x1="198" y1="392" x2="240" y2="392"/>
      <line x1="198" y1="404" x2="240" y2="404"/><line x1="198" y1="416" x2="240" y2="416"/>
      <line x1="198" y1="428" x2="240" y2="428"/><line x1="198" y1="440" x2="240" y2="440"/>
    </g>
    <g fill="#b9b2a6" opacity="0.95">
      <ellipse cx="208" cy="386" rx="10" ry="6"/><ellipse cx="228" cy="398" rx="13" ry="7"/>
      <ellipse cx="212" cy="414" rx="12" ry="6"/><ellipse cx="232" cy="430" rx="9" ry="6"/>
      <ellipse cx="206" cy="440" rx="8" ry="5"/><ellipse cx="222" cy="452" rx="14" ry="5"/>
    </g>
  </g>

  <!-- стол -->
  <rect x="270" y="300" width="300" height="14" fill="#a8774d"/>
  <rect x="282" y="314" width="12" height="160" fill="#8d6240"/>
  <rect x="546" y="314" width="12" height="160" fill="#8d6240"/>

  <!-- стопка книг под монитором -->
  <g stroke="#333" stroke-width="1">
    <rect x="365" y="276" width="110" height="24" fill="#d9534f"/>
    <rect x="370" y="254" width="100" height="22" fill="#5b8def"/>
    <rect x="362" y="232" width="114" height="22" fill="#5cb85c"/>
  </g>
  <!-- монитор -->
  <rect x="408" y="214" width="24" height="18" fill="#2b2f36"/>
  <rect x="350" y="118" width="140" height="100" rx="6" fill="#2b2f36"/>
  <rect x="358" y="126" width="124" height="84" rx="2" fill="#4a90c8"/>
  <!-- блик -->
  <polygon points="362,128 420,128 380,208 362,208" fill="#ffffff" opacity="0.75"/>

  <!-- клавиатура -->
  <rect x="352" y="290" width="120" height="10" rx="2" fill="#555d68"/>

  <!-- чашка и тарелка с едой у клавиатуры -->
  <g>
    <path d="M488 268 h26 l-3 32 h-20 z" fill="#ffffff" stroke="#5a4636" stroke-width="2"/>
    <path d="M514 274 q12 2 0 16" fill="none" stroke="#5a4636" stroke-width="2"/>
    <path d="M494 262 q4 -8 0 -14 M504 262 q4 -8 0 -14" fill="none" stroke="#9aa5b1" stroke-width="2"/>
    <ellipse cx="540" cy="298" rx="22" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <path d="M524 296 q16 -14 32 0 z" fill="#e8b96a" stroke="#a87b3a" stroke-width="1.5"/>
    <rect x="526" y="290" width="28" height="4" fill="#7cc36a"/>
  </g>

  <!-- ученик на табурете без спинки, сутулится -->
  <g>
    <rect x="600" y="372" width="70" height="10" rx="3" fill="#7a5a3c"/>
    <rect x="606" y="382" width="8" height="92" fill="#6a4c32"/><rect x="656" y="382" width="8" height="92" fill="#6a4c32"/>
    <!-- спина колесом -->
    <path d="M622 238 q48 40 28 132" fill="none" stroke="#3a6ea5" stroke-width="22" stroke-linecap="round"/>
    <circle cx="606" cy="222" r="22" fill="#f1c8a0" stroke="#c99a6e" stroke-width="2"/>
    <path d="M586 214 q18 -26 40 -8" fill="#4a3627"/>
    <!-- руки к клавиатуре -->
    <path d="M630 270 q-40 20 -100 24" fill="none" stroke="#3a6ea5" stroke-width="10" stroke-linecap="round"/>
    <!-- ноги -->
    <path d="M650 370 h-48 v100" fill="none" stroke="#2f3b4a" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- обычная урна: старые батарейки и телефон -->
  <g>
    <path d="M706 386 h68 l-8 92 h-52 z" fill="#8f9aa6" stroke="#5d6772" stroke-width="2"/>
    <rect x="700" y="378" width="80" height="10" rx="3" fill="#6f7a86"/>
    <rect x="716" y="350" width="12" height="32" rx="2" fill="#e0a72e" stroke="#7a5a12" transform="rotate(-18 722 366)"/>
    <rect x="734" y="356" width="12" height="28" rx="2" fill="#4f9d4f" stroke="#245824" transform="rotate(12 740 370)"/>
    <rect x="748" y="342" width="22" height="40" rx="4" fill="#2b2f36" stroke="#111" transform="rotate(20 759 362)"/>
    <rect x="752" y="347" width="14" height="26" rx="2" fill="#6f8fb0" transform="rotate(20 759 362)"/>
    <text x="740" y="440" text-anchor="middle" font-size="13" fill="#ffffff">мусор</text>
  </g>
</svg>
