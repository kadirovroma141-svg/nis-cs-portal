<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- пластина -->
  <circle cx="230" cy="210" r="180" fill="#e8eef7" stroke="#34495e" stroke-width="2"/>
  <!-- дорожки -->
  <g fill="none" stroke="#9fb3c8" stroke-width="1.5">
    <circle cx="230" cy="210" r="155"/>
    <circle cx="230" cy="210" r="130"/>
    <circle cx="230" cy="210" r="105"/>
    <circle cx="230" cy="210" r="80"/>
    <circle cx="230" cy="210" r="55"/>
  </g>
  <!-- выделенная дорожка -->
  <circle cx="230" cy="210" r="117.5" fill="none" stroke="#2e86de" stroke-width="25" stroke-opacity="0.25"/>
  <!-- кластер: два соседних сектора на дорожке r 105..130 -->
  <path d="M 230 80 A 130 130 0 0 1 321.9 118.1 L 304.2 135.8 A 105 105 0 0 0 230 105 Z" fill="#f5b041" stroke="#7e5109" stroke-width="1.5"/>
  <path d="M 321.9 118.1 A 130 130 0 0 1 360 210 L 335 210 A 105 105 0 0 0 304.2 135.8 Z" fill="#f8c471" stroke="#7e5109" stroke-width="1.5"/>
  <!-- отдельный сектор -->
  <path d="M 138.1 301.9 A 130 130 0 0 1 100 210 L 125 210 A 105 105 0 0 0 155.8 284.2 Z" fill="#e74c3c" fill-opacity="0.8" stroke="#922b21" stroke-width="1.5"/>
  <!-- шпиндель -->
  <circle cx="230" cy="210" r="22" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
  <!-- коромысло и головка -->
  <circle cx="560" cy="360" r="16" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
  <line x1="560" y1="360" x2="350" y2="235" stroke="#2c3e50" stroke-width="9" stroke-linecap="round"/>
  <rect x="338" y="225" width="18" height="14" fill="#c0392b" stroke="#2c3e50" transform="rotate(30 347 232)"/>
  <!-- подписи -->
  <g fill="#1b2631">
    <line x1="305" y1="112" x2="420" y2="40" stroke="#1b2631"/>
    <text x="425" y="44">Кластер (несколько секторов)</text>
    <line x1="120" y1="270" x2="40" y2="395" stroke="#1b2631"/>
    <text x="10" y="412">Сектор дорожки</text>
    <line x1="230" y1="92" x2="150" y2="22" stroke="#1b2631"/>
    <text x="70" y="18">Дорожка</text>
    <line x1="230" y1="210" x2="420" y2="160" stroke="#1b2631"/>
    <text x="425" y="164">Шпиндель (ось)</text>
    <text x="450" y="355">Коромысло</text>
    <line x1="470" y1="306" x2="485" y2="338" stroke="#1b2631"/>
    <line x1="347" y1="240" x2="390" y2="380" stroke="#1b2631"/>
    <text x="330" y="398">Головка записи/считывания</text>
    <text x="425" y="104" font-size="13" fill="#34495e">Магнитный диск (пластина)</text>
    <line x1="440" y1="110" x2="392" y2="150" stroke="#1b2631"/>
  </g>
</svg>
