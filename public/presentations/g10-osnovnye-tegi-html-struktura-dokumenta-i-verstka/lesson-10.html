<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10.2А · Урок 10 · Блочная вёрстка (div, HTML5) и обобщение 10.2А</title>
  <link rel="stylesheet" href="../_engine/deck.css" />
</head>
<body>
<script src="../_engine/deck.js"></script>
<script>
const L10_CHECKLIST = [
  "Корректный каркас HTML5 (<!DOCTYPE html>, <meta charset=\"utf-8\">, <title>) и комментарии <!-- -->",
  "Заголовки <h1>–<h6>, абзацы <p>, форматирование (<strong>, <em>, <mark>, <sup>, <sub>)",
  "Нумерованные, маркированные и вложенные списки (<ol>, <ul>, <li>)",
  "Гиперссылки: внешние (target=\"_blank\"), локальные и закладки-якоря (#id)",
  "Мультимедиа (<img> с alt, <audio controls>, <video controls>) + авторские права © / CC",
  "Сложная таблица с colspan / rowspan и border-collapse: collapse",
  "Внешний CSS, блочный макет (<div> или <header>/<nav>/<main>/<footer>) + готовый <script>"
];

initDeck({
  badge: "</> 10.2А · Урок 10",
  title: "Блочная и табличная вёрстка (<div>, HTML5) и обобщение 10.2А",
  subtitle: "10 класс · 2 четверть · Обобщение всех целей 10.1.2.2–10.1.2.11 · 80 мин",
  initialState: {
    tabs: { layoutMode: "div" },
    selected: { boxPad: 14, boxBdr: 4, boxMgn: 16 },
    revealed: { useFloat: true, useClear: true, darkDemo: false }
  },
  slides: [
    {
      badge: "Этап 1 · Введение",
      shortTitle: "Эволюция вёрстки: табличная → div → HTML5",
      timing: "0–10 мин",
      source: "КСП 10.2А Урок 10 · Презентация «Вёрстка сайта», слайды 1–4",
      notes: "Переключайте 3 вкладки (Табличная / Блочная <div> / Семантическая HTML5) и обсудите преимущества блочной вёрстки.",
      render(st) {
        const mode = st.tabs.layoutMode || "div";
        return `
          <div class="stack">
            <div class="text-xs font-bold text-muted" style="text-transform:uppercase;">Информатика · 10 класс · Раздел 10.2А · Итоговый урок 10 из 10</div>
            <h1 class="slide-h1">Блочная вёрстка веб-сайта и обобщение раздела</h1>
            <div class="flex-row">
              <button type="button" class="btn ${mode === "table" ? "btn-primary" : ""}" onclick="DECK.setTab('layoutMode','table')">1. Табличная (&lt;table&gt;)</button>
              <button type="button" class="btn ${mode === "div" ? "btn-primary" : ""}" onclick="DECK.setTab('layoutMode','div')">2. Блочная (&lt;div&gt; + CSS)</button>
              <button type="button" class="btn ${mode === "html5" ? "btn-primary" : ""}" onclick="DECK.setTab('layoutMode','html5')">3. Семантическая HTML5</button>
            </div>
            ${mode === "table" ? `
              <div class="box-warning text-xs"><strong>Табличная вёрстка (устаревший способ):</strong> весь сайт собирается в одной гигантской невидимой <span class="mono">&lt;table&gt;</span>. Минусы: громоздкий код, медленная загрузка, плохая адаптивность на телефонах.</div>
            ` : mode === "div" ? `
              <div class="box-primary text-xs"><strong>Блочная вёрстка (<span class="mono">&lt;div&gt;</span> + CSS):</strong> независимые прямоугольные контейнеры <span class="mono">#header, #navigation, #sidebar, #content, #footer</span>. Гибкость, чистый код, быстрая загрузка!</div>
            ` : `
              <div class="box-success text-xs"><strong>Семантическая вёрстка HTML5:</strong> вместо безликих <span class="mono">&lt;div&gt;</span> используются смысловые теги <span class="mono">&lt;header&gt;, &lt;nav&gt;, &lt;main&gt;, &lt;article&gt;, &lt;aside&gt;, &lt;footer&gt;</span> — понятные поисковикам и программам чтения с экрана!</div>
            `}
            <div class="grid-2 text-xs">
              <div class="box"><strong class="mono">&lt;div&gt;</strong> — <strong>блочный</strong> контейнер (с новой строки, на всю доступную ширину).</div>
              <div class="box"><strong class="mono">&lt;span&gt;</strong> — <strong>строчный</strong> контейнер (выделяет фрагмент внутри строки текста).</div>
            </div>
          </div>
        `;
      }
    },
    {
      badge: "Этап 2 · Симулятор макета",
      shortTitle: "Макет сайта: float: left и clear: both",
      timing: "10–22 мин",
      source: "Презентация «CSS и Блочная вёрстка», слайды 10–15 · SB стр. 95–99",
      notes: "Нажмите кнопку «clear: both → ВЫКЛ» — покажите наглядно, как подвал #footer «залезает» под колонки, если не сбросить обтекание!",
      render(st) {
        const fl = !!st.revealed.useFloat;
        const cl = !!st.revealed.useClear;
        return `
          <div class="flex-between">
            <div>
              <h2 class="slide-h2">Классический блочный макет: <span class="mono">float</span> и <span class="mono">clear</span></h2>
              <p class="lead">Попробуйте выключить <span class="mono">float: left</span> или <span class="mono">clear: both</span> у подвала!</p>
            </div>
            <div class="flex-row">
              <button type="button" class="btn ${fl ? "btn-primary" : "btn-accent"}" onclick="DECK.toggleReveal('useFloat')">float: left (${fl ? "ВКЛ" : "ВЫКЛ"})</button>
              <button type="button" class="btn ${cl ? "btn-primary" : "btn-accent"}" onclick="DECK.toggleReveal('useClear')">clear: both (${cl ? "ВКЛ" : "ВЫКЛ"})</button>
            </div>
          </div>
          <div class="grid-12">
            <div class="col-5">
              <pre class="code-block">${DECK.esc(`#container { width: 960px; margin: 0 auto; }\n#header { height: 70px; }\n#navigation { height: 34px; }\n#sidebar { width: 30%; ${fl ? "float: left;" : "/* нет float */"} }\n#content { width: 70%; ${fl ? "float: left;" : "/* нет float */"} }\n#footer { ${cl ? "clear: both;" : "/* НЕТ clear: both! */"} }`)}</pre>
            </div>
            <div class="col-7 browser-frame">
              <div class="browser-bar"><span class="browser-tab">🌐 layout.html (#container)</span></div>
              <div style="padding:12px;background:#fff;color:#111;font-size:12px;font-weight:700;">
                <div style="background:#2b3bb3;color:#fff;padding:12px;border-radius:6px;margin-bottom:6px;text-align:center;">#header (&lt;header&gt;) — Шапка сайта</div>
                <div style="background:#e4e6f7;color:#1f2c8c;padding:7px;border-radius:6px;margin-bottom:6px;text-align:center;">#navigation (&lt;nav&gt;) — Меню</div>
                <div style="overflow:hidden;position:relative;">
                  <div style="background:#fbe6da;color:#8f2d08;padding:18px 10px;border-radius:6px;${fl ? "float:left;width:30%;min-height:110px;" : "margin-bottom:6px;"}">#sidebar (&lt;aside&gt;)<br><span style="font-weight:400;">Меню / аудио</span></div>
                  <div style="background:#e1f0e2;color:#165428;padding:18px 10px;border-radius:6px;${fl ? "float:left;width:68%;margin-left:2%;min-height:92px;" : "margin-bottom:6px;"}">#content (&lt;main&gt;)<br><span style="font-weight:400;">Статья + таблица</span></div>
                  <div style="background:${cl ? "#16161d" : "#b0173d"};color:#fff;padding:10px;border-radius:6px;margin-top:6px;text-align:center;${cl ? "clear:both;" : ""}">
                    ${cl ? "#footer (<footer>) — Подвал на месте (clear: both)" : "⚠ #footer сломался и залез наверх без clear: both!"}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    },
    {
      badge: "Этап 2 · Блочная модель и <script>",
      shortTitle: "Box Model (padding/border/margin) и <script>",
      timing: "22–32 мин",
      source: "SB 10 кл. стр. 96–99 · Цель 10.1.2.11",
      notes: "Покрутите ползунки padding, border и margin. Справа покажите пример готового скрипта <script> (вывод текущей даты и смена темы).",
      render(st) {
        const p = st.selected.boxPad ?? 14;
        const b = st.selected.boxBdr ?? 4;
        const m = st.selected.boxMgn ?? 16;
        const dark = !!st.revealed.darkDemo;
        const nowStr = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
        return `
          <h2 class="slide-h2">Блочная модель CSS и подключение <span class="mono">&lt;script&gt;</span></h2>
          <div class="grid-2">
            <div class="box stack text-xs">
              <div class="box-title">Блочная модель CSS (Box Model)</div>
              <div class="flex-between"><span><strong>padding</strong> (внутренний отступ):</span><span class="mono">${p}px</span></div>
              <input type="range" min="0" max="28" value="${p}" oninput="DECK.setSelected('boxPad',Number(this.value))" />
              <div class="flex-between"><span><strong>border</strong> (граница):</span><span class="mono">${b}px</span></div>
              <input type="range" min="0" max="10" value="${b}" oninput="DECK.setSelected('boxBdr',Number(this.value))" />
              <div class="flex-between"><span><strong>margin</strong> (внешний отступ):</span><span class="mono">${m}px</span></div>
              <input type="range" min="0" max="28" value="${m}" oninput="DECK.setSelected('boxMgn',Number(this.value))" />
              <div style="background:#f8ecd4;border:1px dashed #8f5300;border-radius:8px;padding:4px;">
                <div style="margin:${m}px;border:${b}px solid #2b3bb3;padding:${p}px;background:#e1f0e2;color:#111;text-align:center;font-weight:700;">
                  Содержимое блока (content)
                </div>
              </div>
            </div>
            <div class="box stack text-xs">
              <div class="box-title">Готовый скрипт &lt;script&gt; (цель 10.1.2.11)</div>
              <pre class="code-block" style="font-size:11px;">${DECK.esc(`<p id="today"></p>\n<script>\n  document.getElementById("today").textContent =\n    "Сегодня: " + new Date().toLocaleDateString("ru-RU");\n<\/script>`)}</pre>
              <div style="padding:14px;border-radius:8px;border:1px solid var(--border);background:${dark ? "#0f172a" : "#ffffff"};color:${dark ? "#f8fafc" : "#0f172a"};">
                <div style="font-weight:700;margin-bottom:6px;">📅 Сегодня: ${nowStr}</div>
                <button type="button" class="btn btn-primary" onclick="DECK.toggleReveal('darkDemo')">Переключить тему блока (JS-кнопка)</button>
              </div>
            </div>
          </div>
        `;
      }
    },
    {
      badge: "Мини-HTML №1 · Блочный макет",
      pillClass: "pill-accent",
      shortTitle: "Мини-HTML: Макет на div с обтеканием",
      timing: "32–52 мин",
      source: "Мини-HTML (/html?task=g10-html-blochnaya-float)",
      notes: "Практическая сборка блочного макета на <div> с float и clear прямо в Мини-HTML сайта.",
      render(st, api) {
        return api.renderMiniHtmlTask({
          taskId: "g10-html-blochnaya-float",
          title: "Практика 1: Макет сайта на блоках div с обтеканием",
          summary: "Соберите каркас веб-сайта из блоков <div> с помощью float и clear: both прямо в Мини-HTML.",
          steps: ["#header, #sidebar, #content, #footer", "float: left", "clear: both"],
          meta: "15 мин · Цель 10.1.2.10"
        });
      }
    },
    {
      badge: "Мини-HTML №2 · Итоговый проект (СОЧ)",
      pillClass: "pill-accent",
      shortTitle: "Мини-HTML: Итоговое «Экология родного края»",
      timing: "52–72 мин",
      source: "Мини-HTML (/html?task=g10-html-itog-ekologiya)",
      notes: "Итоговая работа формата СОЧ, объединяющая все изученные теги раздела 10.2А (10.1.2.3–10.1.2.9).",
      render(st, api) {
        return api.renderMiniHtmlTask({
          taskId: "g10-html-itog-ekologiya",
          title: "Практика 2 (формат СОЧ): Страница «Экология родного края»",
          summary: "Комплексное задание по всем темам 2-й четверти: форматирование, списки, ссылки и сложная таблица.",
          steps: ["Текст и списки", "Ссылки", "Таблица с colspan/rowspan", "Автопроверка"],
          meta: "20 мин · Обобщение 10.2А"
        });
      }
    },
    {
      badge: "Этап 3 · Чек-лист 10.2А",
      shortTitle: "Итоговый чек-лист веб-разработчика",
      timing: "72–80 мин",
      source: "КСП 10.2А Урок 10 · Мини-HTML (g10-html-itog-yarmarka)",
      notes: "Отмечайте пункты чек-листа вместе с классом. Внизу даны прямые ссылки на дополнительные итоговые задания Мини-HTML для подготовки к СОЧ.",
      render(st) {
        let done = 0;
        L10_CHECKLIST.forEach((_, i) => { if (st.revealed["chk" + i]) done++; });
        return `
          <div class="flex-between">
            <h2 class="slide-h2">Чек-лист веб-разработчика (итоги 2-й четверти)</h2>
            <span class="pill pill-success mono">${done} / ${L10_CHECKLIST.length}</span>
          </div>
          <div class="stack" style="gap:7px;">
            ${L10_CHECKLIST.map((txt, i) => `
              <button type="button" class="interactive-card ${st.revealed["chk" + i] ? "revealed" : ""}" style="padding:9px 12px;" onclick="DECK.toggleReveal('chk${i}')">
                <span class="mono font-bold">${st.revealed["chk" + i] ? "☑" : "☐"}</span> &nbsp;${DECK.esc(txt)}
              </button>
            `).join("")}
          </div>
          <div class="box-primary flex-between text-xs">
            <div><strong>Подготовка к СОЧ в Мини-HTML:</strong></div>
            <div class="flex-row">
              <a class="btn btn-accent" href="/html?task=g10-html-blochnaya-flex" target="_blank" rel="noopener noreferrer">Блочная вёрстка (Flex) ↗</a>
              <a class="btn btn-primary" href="/html?task=g10-html-itog-yarmarka" target="_blank" rel="noopener noreferrer">Итоговое «Школьная ярмарка» ↗</a>
            </div>
          </div>
        `;
      }
    }
  ]
});
</script>
</body>
</html>
