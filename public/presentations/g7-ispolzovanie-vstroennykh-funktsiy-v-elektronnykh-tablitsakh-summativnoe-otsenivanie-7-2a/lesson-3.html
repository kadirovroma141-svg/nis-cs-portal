    formula: '=СЧЁТЕСЛИ(A2:A5;">160000")',
    res: "3 сделки",
    hit: (r) => r.prop > 160000,
    why: "Считает количество строк в A2:A5, где стоимость имущества строго больше 160 000 (200k, 300k, 400k → 3)."

            </div>

      render(st) {
        const cur = st.tabs.sim || "sum2";
        const s = G7FN3_SIM[cur];
        return `
          <div class="stack">
            <div class="flex-between">
              <h2 class="slide-h2">Пример учебника: таблица «Комиссионные»</h2>
              <div class="flex-row">

            </div>
            <div class="grid-2">
              <table class="data-table">
                <thead><tr><th>Строка</th><th>A (Стоимость имущества)</th><th>B (Комиссионные)</th></tr></thead>
                <tbody>
                  ${G7FN3_COMM.map(r => {
                    const hit = s.hit(r);

                  }).join("")}

              </table>
              <div class="box-primary stack text-xs">
                <div class="box-title">Активная формула</div>
                <div class="code-block" style="font-size:13px;">${DECK_ESC(s.formula)}</div>
                <div class="box-success" style="font-size:15px;">Результат: <strong class="mono">${s.res}</strong></div>
                <p style="margin:0;">${s.why}</p>

    {
