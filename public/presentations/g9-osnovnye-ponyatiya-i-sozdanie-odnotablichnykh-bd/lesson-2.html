window.L2_AUTO_ACT = function(action) {
  const st = window.DECK_STATE;
  if (!st.custom) st.custom = { nextId: 4, rows: [
    { id: 1, name: "Ахметов Д.", cls: "9A" },
    { id: 2, name: "Бекова А.", cls: "9B" },
    { id: 3, name: "Сериков Н.", cls: "9A" }
  ], msg: "Нажмите кнопку, чтобы увидеть работу поля Счётчик." };
  const c = st.custom;
  if (action === "add") {
    const names = ["Омарова Л.", "Жакупов Р.", "Ким В.", "Талгатов С."];
    const name = names[(c.nextId - 4) % names.length];
    const id = c.nextId++;
    c.rows.push({ id, name, cls: id % 2 === 0 ? "9B" : "9C" });
    c.msg = `Добавлена запись #${id}. Счётчик выдал следующий номер (+1).`;
  } else if (action === "del3") {
    const has3 = c.rows.some(r => r.id === 3);
    if (has3) {
      c.rows = c.rows.filter(r => r.id !== 3);
      c.msg = "Запись #3 удалена! Обратите внимание: следующий добавленный ученик получит №" + c.nextId + ", а №3 больше НИКОГДА не появится.";
    } else {
      c.msg = "Запись #3 уже удалена. Добавьте новую запись и проверьте, какой номер она получит!";
    }
  } else if (action === "editFail") {
    c.msg = "⛔ Запрещено! Поле типа «Счётчик» (Код_ученика) доступно только для чтения — вручную изменить номер нельзя.";

    c.nextId = 4;
    c.rows = [
      { id: 1, name: "Ахметов Д.", cls: "9A" },
      { id: 2, name: "Бекова А.", cls: "9B" },
      { id: 3, name: "Сериков Н.", cls: "9A" }
    ];
    c.msg = "Таблица возвращена к исходным 3 записям (следующий ID = 4).";
  }
  window.DECK.render();
};
