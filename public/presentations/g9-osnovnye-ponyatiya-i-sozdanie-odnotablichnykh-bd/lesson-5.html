function wildcardToRegex(pattern) {
  const esc = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".");
  return new RegExp("^" + esc + "$", "i");
}

window.L5_UPDATE = function(patch) {
  Object.assign(window.DECK_STATE.custom, patch);
  window.DECK.render();
};

window.L5_SET_SEARCH = function(val) {
  window.DECK_STATE.custom.search = val;
  window.DECK.render();
};

      source: "SB 9 кл. стр. 72 · Точная таблица «Автомобили»",
      notes: "На живой таблице «Автомобили» из учебника проверьте пример SB: красный седан -> BMW 3; цена < 10 млн -> Toyota Camry, Kia Rio, Toyota Corolla; поиск с * и ?.",
      render(st) {
        const c = st.custom;
        let list = L5_CARS.slice();
        if (c.filter === "red_sedan") list = list.filter(x => x.color === "красный" && x.body === "седан");
        else if (c.filter === "lt10m") list = list.filter(x => x.price < 10000000);
        else if (c.filter === "toyota") list = list.filter(x => x.model.startsWith("Toyota"));

        if (c.search && c.search.trim()) {
          const rx = wildcardToRegex(c.search.trim().includes("*") || c.search.trim().includes("?") ? c.search.trim() : "*" + c.search.trim() + "*");
          list = list.filter(x => rx.test(x.model) || rx.test(x.color) || rx.test(x.body));
        }

        if (c.sortCol !== "none") {
          list.sort((a, b) => {
            const va = a[c.sortCol], vb = b[c.sortCol];
            const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "ru");
            return c.sortDir === "asc" ? cmp : -cmp;
          });
        }
        return `
          <div class="stack">
            <div class="flex-between">
              <h2 class="slide-h2">Симулятор на таблице SB «Автомобили»</h2>
              <span class="pill pill-success mono">Показано: ${list.length} из ${L5_CARS.length}</span>

            <div class="grid-2 text-xs">
              <div class="box flex-row">
                <strong>Фильтр:</strong>
