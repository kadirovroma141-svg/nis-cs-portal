const L3_PRESETS = {
  gos: {
    label: "Госномер: 000 >LLL 00",
    mask: "000 >LLL 00",
    good: "745 >KZM 02 -> 745 KZM 02 (вводите: 745 kzm 02)",
    testGood: "745 kzm 02",
    testBad: "74 kzm 02",
    check(val) {
      const clean = val.replace(/\s+/g, "").toUpperCase();
      if (!/^\d{3}[A-ZА-ЯЁ]{3}\d{2}$/i.test(clean)) {
        return { ok: false, out: val, msg: "Нужно ровно 3 цифры + 3 буквы + 2 цифры (например 745kzm02)." };
      }
      const formatted = clean.slice(0,3) + " " + clean.slice(3,6) + " " + clean.slice(6,8);
      return { ok: true, out: formatted, msg: "✓ Верно! >LLL перевёл буквы в верхний регистр: " + formatted };
    }
  },
  cls: {
    label: "Класс: 00\\-L",
    mask: "00\\-L",
    good: "09-A",
    testGood: "09-A",
    testBad: "9-A",
    check(val) {
      const m = val.trim().match(/^(\d{2})-([A-Za-zА-Яа-яЁё])$/);
      if (!m) return { ok: false, out: val, msg: "Формат 00\\-L требует ДВЕ обязательные цифры (напр. 09), дефис и 1 букву!" };
      return { ok: true, out: m[1] + "-" + m[2], msg: "✓ Принято маской 00\\-L: " + m[1] + "-" + m[2] };
    }
  },
  iin: {
    label: "ИИН: 000000000000",
    mask: "000000000000",
    good: "090512500123",
    testGood: "090512500123",
    testBad: "09051250",
    check(val) {
      if (!/^\d{12}$/.test(val.trim())) return { ok: false, out: val, msg: "Введено символов: " + val.trim().length + ". Маска 000000000000 требует ровно 12 цифр!" };
      return { ok: true, out: val.trim(), msg: "✓ Принято! Ведущий ноль сохранён (Текстовый тип)." };
    }
  },
  date: {
    label: "Дата: 00.00.0000",
    mask: "00.00.0000",
    good: "09.05.2025",
    testGood: "09.05.2025",
    testBad: "9.5.2025",
    check(val) {
      if (!/^\d{2}\.\d{2}\.\d{4}$/.test(val.trim())) return { ok: false, out: val, msg: "Обязательны 2 цифры дня, точка, 2 цифры месяца, точка, 4 цифры года!" };
      return { ok: true, out: val.trim(), msg: "✓ Формат даты соблюдён: " + val.trim() };
    }
  },
  tel: {
    label: "Телефон: +7 (000) 000-00-00",
    mask: "+7 (000) 000-00-00",
    good: "+7 (701) 123-45-67",
    testGood: "+7 (701) 123-45-67",
    testBad: "87011234567",
    check(val) {
      const digits = val.replace(/\D/g, "");
      if (digits.length !== 11 || (digits[0] !== "7" && digits[0] !== "8")) {
        return { ok: false, out: val, msg: "Нужен полный 10-значный номер после +7 (например +7 (701) 123-45-67)." };
      }
      const f = `+7 (${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7,9)}-${digits.slice(9,11)}`;
      return { ok: true, out: f, msg: "✓ Единый стандарт сохранён: " + f };
    }
  }
};

  { id: "q5", q: "Вычисляемое поле для числа ночей в гостинице ([Дата выезда]-[Дата заезда]).", ans: "calc", opts: ["Счётчик", "calc", "MEMO"], why: "«Вычисляемое поле» автоматически считает разность дат." }

window.L3_SET_PRESET = function(k) {
  const st = window.DECK_STATE;
  st.custom.preset = k;
  st.custom.input = L3_PRESETS[k].testGood;
  window.DECK.render();
};

window.L3_SET_INPUT = function(val) {
  window.DECK_STATE.custom.input = val;
  const outEl = document.getElementById("l3-live-res");
  if (outEl) {
    const res = L3_PRESETS[window.DECK_STATE.custom.preset].check(val);
    outEl.className = (res.ok ? "box-success" : "box-danger") + " text-xs";
    outEl.innerHTML = `<strong>Результат проверки:</strong> ${window.DECK_ESC(res.msg)}`;
  }
};
