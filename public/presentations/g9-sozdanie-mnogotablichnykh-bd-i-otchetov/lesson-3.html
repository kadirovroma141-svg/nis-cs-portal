window.L3B_SET_PARAM = function(shop, maxPrice) {
  window.DECK_STATE.custom.paramShop = shop;
  window.DECK_STATE.custom.paramMax = maxPrice;
  window.DECK.render();
};

window.L3B_FORA_ACT = function(mode) {
  const c = window.DECK_STATE.custom;
  if (mode === "preview") {
    c.foraMode = "preview";
  } else if (mode === "apply") {
    c.foraMode = "applied";
    c.foraRows = c.foraRows.map(r => r.shop === "Fora" ? Object.assign({}, r, { price: Math.round(r.price / 2), updated: true }) : r);
  } else if (mode === "reset") {
    c.foraMode = "idle";
    c.foraRows = L3B_PC_ROWS.map(x => Object.assign({}, x));
  }
  window.DECK.render();
};

      notes: "Повторите отличия Мастера и Конструктора и пройдите 6 шагов построения многотабличного запроса (обязательно проверять линии связей между таблицами в окне Конструктора!).",

    {
      badge: "Этап 2 · Задача SB «Классы и Ученики»",

      render(st) {
        const jt = st.tabs.joinType || "two";
        const j = L3B_JOIN_PRESETS[jt];
        return `
          <div class="stack">
            <div class="flex-between">
              <h2 class="slide-h2">Многотабличный QBE ⇄ SQL (<span class="mono">INNER JOIN</span>)</h2>

                <button type="button" class="btn ${jt === "three" ? "btn-accent" : ""}" onclick="DECK.setTab('joinType','three')">${L3B_JOIN_PRESETS.three.label}</button>
              </div>
            </div>
            <div class="box-title">Бланк Конструктора QBE (обратите внимание на строку «Имя таблицы»)</div>

      render(st) {
        const shop = st.custom.paramShop || "Sulpak";
        const maxP = Number(st.custom.paramMax || 90000);

          <div class="stack">

                <div class="box-danger">
                  <strong>Строгий запрет SB:</strong> текст внутри <span class="mono">[...]</span> <strong>НЕ может совпадать с именем поля/таблицы</strong> и <strong>НЕ может содержать «.» и «!»</strong>!

                <div class="flex-row text-xs">
                  <strong>2) Цена ≤ [Макс. цена]:</strong>

        const fn = st.tabs.grpFn || "Sum";
        const shops = ["Sulpak", "Fora", "Technodom"];
        const calc = (arr) => {
          if (fn === "Sum") return arr.reduce((a,b) => a + b.price, 0).toLocaleString("ru-RU") + " ₸";
