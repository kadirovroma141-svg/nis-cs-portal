function calcAgg(arr, fn) {
  const prices = arr.map(x => x.price);
  if (fn === "Sum") return prices.reduce((a,b) => a + b, 0).toLocaleString("ru-RU") + " ₸";
  if (fn === "Count") return prices.length + " шт.";
  if (fn === "Avg") return Math.round(prices.reduce((a,b) => a + b, 0) / prices.length).toLocaleString("ru-RU") + " ₸";
  if (fn === "Min") return Math.min(...prices).toLocaleString("ru-RU") + " ₸";
  return Math.max(...prices).toLocaleString("ru-RU") + " ₸";
}
