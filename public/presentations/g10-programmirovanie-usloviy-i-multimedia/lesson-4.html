/*
 * 10.3В «Разработка приложений (C#)», урок 4 (КТП) — «Элементы управления для организации выбора
 * (RadioButton и CheckBox): свойства и программирование разветвляющихся алгоритмов».
 * Цели обучения: 10.4.3.13 использовать компоненты ООП для организации выбора;
 *                10.4.3.14 использовать условный оператор в ООП.
 * Ход урока — КСП content/lesson-plans/g10-programmirovanie-usloviy-i-multimedia.json, урок 4 (10 + 60 + 10 мин).
 * Содержание — только из материалов: учебник 10 кл. стр. 188–192 (урок 7.5), стр. 131 (независимые checkBox);
 * презентация «Массивы и языки программирования», слайд 8 (проверка деления на 0).
 * В материалах нет: контейнера GroupBox/Panel и значения FlatStyle = System (упомянуты в КСП) — не использованы.
 * В учебнике опечатки «TextAllign», «CheckAllign», «FlatS tyle» — здесь TextAlign, CheckAlign, FlatStyle.
 * Аналогия RadioButton ↔ дизъюнкция, CheckBox ↔ конъюнкция (стр. 188) сомнительна — не используется.
 */
const SB = "Учебник 10 кл., ";
const PM = "Презентация «Массивы и языки программирования», ";
const { src, reveal, statements, quiz, matcher } = LESSON;
const S = () => window.DECK_STATE;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const code = (t, fs = 16) => `<pre class="code-block" style="font-size:${fs}px;line-height:1.42;margin:0;">${esc(t)}</pre>`;

/* Внешний вид переключателя и флажка */
const radio = (on, label, click) => `<button type="button" class="opt" style="padding:6px 10px;font-size:16px;" onclick="${click}"><span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--primary);">${on ? '<span style="width:10px;height:10px;border-radius:50%;background:var(--primary);"></span>' : ""}</span><span>${label}</span></button>`;
const check = (on, label, click) => `<button type="button" class="opt" style="padding:6px 10px;font-size:16px;" onclick="${click}"><span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;border:2px solid var(--primary);background:${on ? "var(--primary)" : "transparent"};color:var(--primary-fg);font-size:14px;font-weight:800;">${on ? "✓" : ""}</span><span>${label}</span></button>`;

/* ---------- модель приложения из учебника (стр. 189–191) ---------- */
window.APP = {
  array() {
    const st = S();
    const m = st.selected["mode"];
    let B = [];
    if (m === "rnd") for (let i = 0; i <= 9; i++) B.push(1 + Math.floor(Math.random() * 9)); // B[i] = rnd.Next(1, 10)
    else if (m === "code") B = [12, 5, 8, 23, 45, 6];
    else if (m === "kbd") B = [4, -8, 6, 3, -7, 18]; // строки richTextBox1 (рис. на стр. 189)
    st.selected["arr"] = B.join(" ");
    st.selected["show"] = "";
    DECK.render();
  },
  count() {
    const st = S();
    st.selected["show"] = (st.revealed["cb1"] ? "1" : "") + (st.revealed["cb2"] ? "2" : "");
    DECK.render();
  },
  clear() {
    const st = S();
    st.selected["arr"] = "";
    st.selected["show"] = "";
    DECK.render();
  },
};
function appDemo() {
  const st = S();
  const m = st.selected["mode"];
  const arr = (st.selected["arr"] || "").split(" ").filter(Boolean).map(Number);
  const show = st.selected["show"] || "";
  const max = arr.length ? Math.max(...arr) : "";
  const sum = arr.reduce((a, b) => a + b, 0);
  return `<div class="card" style="padding:12px 14px;">
    <div class="grid-2" style="gap:14px;">
      <div class="stack" style="gap:6px;">
        <b class="text-xs">Способ задания массива</b>
        ${radio(m === "rnd", "Массив случайных чисел", "DECK.setSelected('mode','rnd')")}
        ${radio(m === "code", "Определение массива в программном коде", "DECK.setSelected('mode','code')")}
        ${radio(m === "kbd", "Ввод массива с клавиатуры", "DECK.setSelected('mode','kbd')")}
        ${m === "kbd" ? '<div class="mono text-xs" style="border:1px solid var(--border-strong);border-radius:6px;padding:4px 8px;">richTextBox1: 4 / -8 / 6 / 3 / -7 / 18</div>' : ""}
      </div>
      <div class="stack" style="gap:6px;">
        <b class="text-xs">Что вывести</b>
        ${check(st.revealed["cb1"], "Максимум элементов", "DECK.toggleReveal('cb1')")}
        ${check(st.revealed["cb2"], "Сумма элементов", "DECK.toggleReveal('cb2')")}
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-primary" onclick="APP.array()" ${m ? "" : "disabled"}>Массив</button>
          <button type="button" class="btn" onclick="APP.count()" ${arr.length ? "" : "disabled"}>Подсчет</button>
          <button type="button" class="btn" onclick="APP.clear()">Очистить</button>
        </div>
      </div>
    </div>
    <div class="mono" style="margin-top:10px;font-size:16px;">Сформированный массив: <b>${arr.join(" ")}</b></div>
    <div class="mono" style="font-size:16px;">${show.includes("1") ? `Максимум элементов = <b>${max}</b> &nbsp; ` : ""}${show.includes("2") ? `Сумма элементов = <b>${sum}</b>` : ""}</div>
  </div>`;
}

/* ---------- окно заказа (условный пример из КСП) ---------- */
function orderDemo() {
  const st = S();
  const size = st.selected["pz"];
  const tops = ["Сыр", "Грибы", "Оливки"];
  return `<div class="grid-2" style="gap:16px;">
    <div class="card stack" style="gap:6px;"><b>Размер (один вариант)</b>

    <div class="card stack" style="gap:6px;"><b>Добавки (любое количество)</b>
      ${tops.map((s, i) => check(st.revealed["tp" + i], s, `DECK.toggleReveal('tp${i}')`)).join("")}</div>
  </div>`;
}
