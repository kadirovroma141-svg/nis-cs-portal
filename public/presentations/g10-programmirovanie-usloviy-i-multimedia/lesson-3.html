    </div>`;
}

    <div style="border:2px solid var(--border-strong);border-radius:8px;height:200px;overflow:auto;background:var(--surface);">${list || '<div class="text-muted" style="padding:8px;font-size:15px;">listBox1 пуст</div>'}</div>
