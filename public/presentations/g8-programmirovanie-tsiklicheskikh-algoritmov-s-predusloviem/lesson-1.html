/* Код C++: num — нумерация строк, hl — подсвеченные строки, size — кегль. */
function code(txt, o = {}) {
  const lines = txt.replace(/^\n/, "").replace(/\n\s*$/, "").split("\n");
  const size = o.size || 15;
  const body = lines
    .map((l, i) => {
      const n = o.num ? `<span style="opacity:.45;display:inline-block;width:2.1em;user-select:none">${i + 1}</span>` : "";
      const on = (o.hl || []).includes(i + 1);
      return `<span style="display:block;${on ? "background:rgba(255,196,0,.22);" : ""}">${n}${H(l) || " "}</span>`;
    })
    .join("");
  return `<pre class="code-block" style="font-size:${size}px;line-height:1.42;margin:0;${o.style || ""}">${body}</pre>`;
}

/* Пошаговая трассировка: строки таблицы открываются по одной; пустые строки — бланк для учеников. */
function stepper(key, head, rows, o = {}) {
  const n = Math.min(Number(S().selected[key] || 0), rows.length);
  const fs = o.size || 16;
  const th = head.map((h) => `<th style="padding:5px 8px;">${h}</th>`).join("");
  const tr = rows
    .map((r, i) => {
      const on = i < n;
      const cur = i === n - 1;
      return `<tr style="${cur ? "background:var(--primary-soft);" : ""}">${r
        .map((c) => `<td style="padding:4px 8px;">${on ? c : "&nbsp;"}</td>`)
        .join("")}</tr>`;
    })
    .join("");
  const btn = (t, v, p = "") => `<button type="button" class="btn ${p}" onclick="DECK.setSelected('${key}','${v}')">${t}</button>`;
  return `<table class="t" style="font-size:${fs}px;"><tr>${th}</tr>${tr}</table>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      ${btn("Следующий шаг ▶", n + 1 > rows.length ? rows.length : n + 1, "btn-primary")}${btn("Показать всё", rows.length)}${btn("Сначала", 0)}
      <span class="score">Шаг ${n} из ${rows.length}</span>
    </div>`;
}

/* Блок-схемы: T — начало/конец, P — действие, IO — ввод/вывод, D — условие, HX — блок «цикл», A — стрелка. */
function tx(x, y, t, fs = 15) {
  const L = String(t).split("|");
  const lh = fs + 3;
  const y0 = y - ((L.length - 1) * lh) / 2 + fs * 0.36;
  return `<text x="${x}" y="${y0}" text-anchor="middle" style="font-size:${fs}px">${L.map((s, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${H(s)}</tspan>`).join("")}</text>`;
}
const fc = {
  T: (x, y, w, h, t, fs) => `<rect class="blk-a" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}"/>${tx(x, y, t, fs)}`,
  P: (x, y, w, h, t, fs) => `<rect class="blk" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="5"/>${tx(x, y, t, fs)}`,
  IO: (x, y, w, h, t, fs) => `<polygon class="blk" points="${x - w / 2 + 14},${y - h / 2} ${x + w / 2},${y - h / 2} ${x + w / 2 - 14},${y + h / 2} ${x - w / 2},${y + h / 2}"/>${tx(x, y, t, fs)}`,
  D: (x, y, w, h, t, fs) => `<polygon class="blk-p" points="${x},${y - h / 2} ${x + w / 2},${y} ${x},${y + h / 2} ${x - w / 2},${y}"/>${tx(x, y, t, fs)}`,
  HX: (x, y, w, h, t, fs) => `<polygon class="blk-p" points="${x - w / 2 + 16},${y - h / 2} ${x + w / 2 - 16},${y - h / 2} ${x + w / 2},${y} ${x + w / 2 - 16},${y + h / 2} ${x - w / 2 + 16},${y + h / 2} ${x - w / 2},${y}"/>${tx(x, y, t, fs)}`,
  A: (d) => `<path class="ar" d="${d}"/>`,
  L: (x, y, t, a = "middle") => `<text class="s" x="${x}" y="${y}" text-anchor="${a}">${H(t)}</text>`,
};
function svg(w, h, inner, label, maxH) {
