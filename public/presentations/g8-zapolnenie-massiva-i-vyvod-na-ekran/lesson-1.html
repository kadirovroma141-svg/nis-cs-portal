const code = (t, fs = 17) => `<pre class="code-block" style="font-size:${fs}px;line-height:1.45;">${escH(t)}</pre>`;

/* Ряд ячеек массива: значение сверху, индекс снизу; hiTo — сколько ячеек уже заполнено. */
function cells(vals, opts = {}) {
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;">${opts.name ? `<div class="font-bold mono" style="align-self:center;margin-right:6px;">${opts.name}</div>` : ""}${vals
    .map((v, i) => {
      const on = opts.cur === i;
      return `<div style="display:grid;gap:4px;text-align:center;">
        <div class="mono" style="min-width:${opts.w || 62}px;padding:9px 6px;border-radius:10px;border:2px solid ${on ? "var(--accent)" : "var(--primary)"};background:${on ? "var(--accent-soft)" : "var(--surface)"};font-weight:700;">${v}</div>
        <div class="mono text-xs" style="color:var(--primary);font-weight:800;">[${i}]</div></div>`;
    })
    .join("")}</div>`;
}

/* Пошаговое выполнение цикла for: каждая кнопка — одна итерация; растёт трассировочная таблица. */
function stepper(key, name, rows, label) {
  const k = Number(S().selected[key] || 0);
  const vals = rows.map((r, i) => (i < k ? r[1] : "?"));
  const body = rows.slice(0, k).map((r) => `<tr><td class="mono">${r[0]}</td><td class="mono">${r[2] ?? r[1]}</td></tr>`).join("");
  const btn = k < rows.length
    ? `<button type="button" class="btn btn-primary" onclick="DECK.setSelected('${key}','${k + 1}')">${label} (i = ${k})</button>`
    : `<button type="button" class="btn" onclick="DECK.setSelected('${key}','0')">Сначала</button> <span class="text-sm">Цикл завершён: i = ${rows.length}, условие i &lt; ${rows.length} ложно.</span>`;
  return `<div class="stack">${cells(vals, { name, cur: k < rows.length ? k : undefined })}
    <div>${btn}</div>
    <table class="t" style="max-width:420px;"><tr><th>i</th><th>${name}[i]</th></tr>${body || '<tr><td colspan="2" class="text-muted">Трассировочная таблица заполнится по шагам.</td></tr>'}</table></div>`;
}

/* Случайные числа для демонстрации диапазонов (имитация rand() в браузере). */

};
