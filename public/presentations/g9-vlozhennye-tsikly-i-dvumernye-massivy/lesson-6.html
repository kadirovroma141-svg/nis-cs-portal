/* Матрица с суммами строк / столбцов / всей матрицы по выбору режима */
function sumTable(key) {
  const mode = S().selected[key] || "";
  const rs = A.map((r) => r.reduce((a, b) => a + b, 0));
  const cs = A[0].map((_, j) => A.reduce((a, r) => a + r[j], 0));
  const all = rs.reduce((a, b) => a + b, 0);
  const chip = (id, t) => `<button type="button" class="chip ${mode === id ? "on" : ""}" onclick="DECK.setSelected('${key}','${mode === id ? "" : id}')">${t}</button>`;
  const body = A.map((r, i) => `<tr><th>i=${i}</th>${r.map((v) => `<td class="${mode === "all" ? "hl" : ""}">${v}</td>`).join("")}<th style="color:var(--accent);">${mode === "row" ? rs[i] : ""}</th></tr>`).join("");
  return `<div class="stack tight"><div class="chips">${chip("all", "Сумма всех")}${chip("row", "Каждой строки")}${chip("col", "Каждого столбца")}</div>
    <table class="mx" style="pointer-events:none;"><tr><th></th>${A[0].map((_, j) => `<th>j=${j}</th>`).join("")}<th>Σ строки</th></tr>${body}
    <tr><th>Σ столбца</th>${cs.map((c) => `<th style="color:var(--accent);">${mode === "col" ? c : ""}</th>`).join("")}<th style="color:var(--accent);">${mode === "all" ? all : ""}</th></tr></table></div>`;
}

const ALL = String.raw`int matr[n][m], [[sum = 0]];
for (int i = 0; i < n; i++)
{   for (int j = 0; j < m; j++)
    {   matr[i][j] = 1 + rand() % 100;
        sum = sum + matr[i][j];
    }
}
[[cout << sum << endl;]]`;
const ROW = String.raw`int matr[n][m], sum;
for (int i = 0; i < n; i++)
{   [[sum = 0;]]
    for (int j = 0; j < m; j++)
    {   matr[i][j] = 1 + rand() % 100;
        sum = sum + matr[i][j];
    }
    [[cout << sum << endl;]]
}`;
const COL = String.raw`for (int j = 0; j < m; ++j)
{   [[sum = 0;]]
    for (int i = 0; i < n; ++i)
    {   sum += array[i][j];   }
    [[cout << "sum [" << j << "] = " << sum << endl;]]
}`;
const NEG = String.raw`int array[5][3], s = 0, p = 1;
for (int i = 0; i < 5; i++)
   for (int j = 0; j < 3; j++)
   {   if (array[i][j] < 0)
       {   s = s + array[i][j];
           p = p * array[i][j];
       }
   }
cout << s << " " << p;`;
