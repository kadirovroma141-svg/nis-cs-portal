 */

/* ---------- построитель блок-схем (фигуры — как в учебнике 7 кл.: овал, параллелограмм, прямоугольник, ромб) ----------
 * items: [{t:"Начало"} | {io:"Ввод a"} | {a:"max = a"} | {if:"a > b ?", yes:[…], no:[…], yesSide:"right"}]
 * Подпись в несколько строк — через «|». Ветка «Нет» слева, «Да» справа (как чаще в учебнике), если не указано иное. */
function FC(items, opt = {}) {
  const W = opt.w || 600, G = opt.gap || 22, out = [];
  let maxY = 0;
  const H = { t: 38, io: 42, a: 42 };
  const tx = (x, y, txt) => {
    const ls = String(txt).split("|"), lh = 18, y0 = y - ((ls.length - 1) * lh) / 2 + 5;
    return ls.map((l, i) => `<text x="${x}" y="${y0 + i * lh}" text-anchor="middle">${l}</text>`).join("");
  };
  const hOf = (it) => (it.if ? (it.ch || 70) : (it.h || H[it.t !== undefined ? "t" : it.io !== undefined ? "io" : "a"]));
  function box(it, x, top) {
    const h = hOf(it), cy = top + h / 2;
    if (it.t !== undefined) { const w = it.w || 130; out.push(`<g class="nd"><rect class="blk-p" x="${x - w / 2}" y="${top}" width="${w}" height="${h}" rx="${h / 2}"/>${tx(x, cy, it.t)}</g>`); }
    else if (it.io !== undefined) { const w = it.w || 190, s = 12; out.push(`<g class="nd"><polygon class="blk" points="${x - w / 2 + s},${top} ${x + w / 2 + s},${top} ${x + w / 2 - s},${top + h} ${x - w / 2 - s},${top + h}"/>${tx(x, cy, it.io)}</g>`); }
    else { const w = it.w || 170; out.push(`<g class="nd"><rect class="blk" x="${x - w / 2}" y="${top}" width="${w}" height="${h}" rx="4"/>${tx(x, cy, it.a)}</g>`); }
    return top + h;
  }
  function ifNode(it, x, top) {
    const ch = it.ch || 70, cw = it.cw || 200, cy = top + ch / 2, off = it.off || 175;
    out.push(`<g class="nd"><polygon class="blk-a" points="${x},${top} ${x + cw / 2},${cy} ${x},${top + ch} ${x - cw / 2},${cy}"/>${tx(x, cy, it.if)}</g>`);
    const yr = it.yesSide !== "left";
    const sides = [[it.yes || [], yr ? 1 : -1, "Да"], [it.no || [], yr ? -1 : 1, "Нет"]];
    const btop = top + ch + G;
    const ends = sides.map(([list, sg, lab]) => {
      const bx = x + sg * off, vx = x + sg * (cw / 2);
      out.push(`<text class="s" x="${vx + sg * 18}" y="${cy - 8}" text-anchor="middle">${lab}</text>`);
      if (!list.length) { out.push(`<path class="ln" d="M${vx} ${cy} H${bx} V${btop}"/>`); return { bx, bottom: btop }; }
      out.push(`<path class="ar" d="M${vx} ${cy} H${bx} V${btop - 2}"/>`);
      return { bx, bottom: seq(list, bx, btop) };
    });
    const my = Math.max(...ends.map((e) => e.bottom)) + G;
    ends.forEach((e) => out.push(`<path class="ln" d="M${e.bx} ${e.bottom} V${my} H${x}"/>`));
    out.push(`<circle cx="${x}" cy="${my}" r="3.5" fill="var(--primary)"/>`);
    return my;
  }
  function seq(list, x, top) {
    let y = top;
    list.forEach((it, i) => {
      if (i > 0) { out.push(`<path class="ar" d="M${x} ${y} V${y + G - 2}"/>`); y += G; }
      y = it.if ? ifNode(it, x, y) : box(it, x, y);
      maxY = Math.max(maxY, y);
    });
    return y;
  }
  seq(items, opt.x || W / 2, 6);
  const Hh = maxY + 8;
  return `<svg class="dia fc" viewBox="0 0 ${W} ${Hh}" style="max-height:${opt.max || 430}px" role="img" aria-label="${opt.label || "Блок-схема"}">
  <defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker></defs>
  ${out.join("\n  ")}
</svg>`;
}
/** Код C++ без подсветки; < и > экранируются. */
const code = (s, fs = 15) => `<pre class="code-block" style="font-size:${fs}px;line-height:1.45;">${String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;

/* Числовая ось (перерисовано по SB стр. 159): от -5 до 12. */
function axis(n, kind) {
  const X = (v) => 30 + (v + 5) * 32;
  const ticks = { 1: [-1, 7], 2: [-1, 7], 3: [-3, 2, 10] }[kind];
  let mark = "";
  if (kind === 1) mark = `<path d="M${X(-5)} 30 H${X(-1)} M${X(7)} 30 H${X(12)}" stroke="var(--accent)" stroke-width="7"/>`;
  if (kind === 2) mark = `<path d="M${X(-1)} 30 H${X(7)}" stroke="var(--accent)" stroke-width="7"/>`;
  const dots = ticks.map((v) => `<circle cx="${X(v)}" cy="30" r="6" fill="var(--accent)"/><text class="s" x="${X(v)}" y="62" text-anchor="middle">${v}</text>`).join("");
  return `<svg class="dia" viewBox="0 0 620 72" style="max-height:70px" role="img" aria-label="Числовая ось ${n}">
    <defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker></defs>
    <text x="8" y="36" style="font-size:18px">${n}</text>
    <path class="ar" d="M30 30 H600"/>${mark}${dots}<text class="s" x="604" y="58" text-anchor="end">x</text>
  </svg>`;
}
