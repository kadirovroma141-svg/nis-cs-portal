    g += `<line x1="${x}" y1="${Y0}" x2="${x}" y2="${y}" stroke="var(--primary)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="6" fill="var(--primary)"/>`;

  g += `<line x1="${X0}" y1="${Y0}" x2="${X0 + 6 * DX + 20}" y2="${Y0}" stroke="var(--fg)" stroke-width="2"/>`;
  g += `<line x1="${X0}" y1="${Y0}" x2="${X0}" y2="24" stroke="var(--fg)" stroke-width="2"/>`;
  g += `<text class="s" x="${X0}" y="${Y0 + 22}" text-anchor="middle">0 с</text><text class="s" x="${X0 + 6 * DX}" y="${Y0 + 22}" text-anchor="middle">1 с</text>`;

  g += `<text class="s" x="${X0 + 6}" y="18">уровень (разрядность 3 бита)</text>`;
  return `<svg class="dia" viewBox="0 0 600 290" role="img" aria-label="Замеры звука за одну секунду">${g}</svg>`;
})();
