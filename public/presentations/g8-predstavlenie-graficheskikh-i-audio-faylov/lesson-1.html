const SMILE = ["00111100", "01000010", "10100101", "10000001", "10100101", "10011001", "01000010", "00111100"];

  const n = rows.length, w = rows[0].length, off = showNums ? 70 : 4;
  let g = "";

    if (showNums) g += `<text class="s" x="${off - 12}" y="${4 + y * cell + cell * 0.66}" text-anchor="end">Строка ${y + 1}</text>`;

  });
  return `<svg class="dia" style="max-height:${showNums ? 330 : 300}px" viewBox="0 0 ${off + w * cell + 6} ${n * cell + 8}" role="img" aria-label="Чёрно-белый рисунок 8 на 8 пикселей">${g}</svg>`;
};

})();

// Дискретизация (ось X) и квантование (ось Y), 3-битная шкала — по рисунку SB стр. 82 (значения условные).
const DIA_SAMPLING = (() => {
  const X0 = 70, Y0 = 250, DX = 52, DY = 28;
  const f = (x) => 3.5 + 3.2 * Math.sin((x - X0) / 75);           // непрерывная волна (уровень как функция x)
  const lv = Array.from({ length: 10 }, (_, i) => Math.max(0, Math.min(7, Math.round(f(X0 + i * DX))))); // квантование
  let g = "";
  for (let k = 0; k < 8; k++) {
    const y = Y0 - k * DY;
    g += `<line x1="${X0}" y1="${y}" x2="${X0 + 9 * DX + 20}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/>`;
    g += `<text class="s" x="${X0 - 10}" y="${y + 5}" text-anchor="end">${k.toString(2).padStart(3, "0")}</text>`;
  }
  let d = "";
  lv.forEach((v, i) => {
    const x = X0 + i * DX, y = Y0 - v * DY;
    d += (i ? " L" : "M") + `${x} ${y}`;
    g += `<line x1="${x}" y1="${Y0}" x2="${x}" y2="${y}" stroke="var(--primary)" stroke-width="2"/>`;
    g += `<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)"/>`;
  });
  let wave = "";
  for (let x = X0; x <= X0 + 9 * DX; x += 4) wave += (x === X0 ? "M" : " L") + `${x} ${(Y0 - f(x) * DY).toFixed(1)}`;
  g += `<path d="${wave}" fill="none" stroke="var(--accent)" stroke-width="3" opacity="0.8"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6 5"/>`;
  g += `<line x1="${X0}" y1="${Y0}" x2="${X0 + 9 * DX + 30}" y2="${Y0}" stroke="var(--fg)" stroke-width="2"/>`;
  g += `<line x1="${X0}" y1="${Y0}" x2="${X0}" y2="20" stroke="var(--fg)" stroke-width="2"/>`;
  g += `<text class="s" x="${X0 + 9 * DX + 30}" y="${Y0 + 24}" text-anchor="end">t (время) — дискретизация: деление оси X</text>`;
  g += `<text class="s" x="${X0 + 8}" y="16">уровень — квантование: деление оси Y</text>`;
  return `<svg class="dia" viewBox="0 0 620 285" role="img" aria-label="Дискретизация по времени и квантование по уровню">${g}</svg>`;
})();
